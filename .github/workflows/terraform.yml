name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      app_version:
        description: 'App version to deploy (only for apply action)'
        required: false
        type: string

# OIDC permissions for keyless authentication
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_WORKING_DIR: terraform/app
  TF_VAR_lambda_package_path: ../output/package.zip
  TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
  TF_VAR_admin_username: ${{ secrets.ADMIN_USERNAME }}
  TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
  TF_VAR_project_bucket: ${{ secrets.AWS_PROJECT_S3_BUCKET }}
  TF_VAR_alert_email: ${{ vars.PERSONAL_EMAIL }}
  TF_VAR_web_domain_name: linhhn508.qd.je

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">= 1.5"

      - name: Terraform fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: format
    outputs:
      reusable-delegation-set-id: ${{ steps.get_reusable_delegation_set.outputs.delegation_set_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">= 1.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Backend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Get Route53 reusable delegation set ID
        id: get_reusable_delegation_set
        run: |
          DELEGATION_SET_ID=$(aws route53 list-reusable-delegation-sets --query "DelegationSets[?CallerReference=='motorShop_serverless_delegation_set']" --output json | jq -r '.[].Id  | split("/") | last')
          echo "delegation_set_id=$DELEGATION_SET_ID" >> "$GITHUB_OUTPUT"
          echo "Reusable delegation set ID: $DELEGATION_SET_ID"

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_delegation_set_id: ${{ steps.get_reusable_delegation_set.outputs.delegation_set_id }}
        run: terraform plan -no-color


  deploy:
    name: Terraform Apply/Destroy
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'apply' || inputs.action == 'destroy')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">= 1.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Backend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download release artifacts
        if: inputs.action == 'apply'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading release artifacts..."
          gh release download --repo ${{ github.repository }} --pattern "*.zip" --dir output
          unzip -o output/*.zip -d output/
          cd output/release/backend-package && zip -r package.zip . && mv package.zip ../../package.zip

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform apply
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_delegation_set_id: ${{ needs.plan.outputs.reusable-delegation-set-id }}
        run: terraform apply -auto-approve -no-color

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_delegation_set_id: ${{ needs.plan.outputs.reusable-delegation-set-id }}
        run: terraform destroy -auto-approve -no-color

      - name: Sync frontend to S3 (after apply)
        if: inputs.action == 'apply'
        run: |
          echo "aws s3 sync ... (handled by Terraform/CloudFront)"