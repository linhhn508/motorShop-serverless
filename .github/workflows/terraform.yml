name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy
      app_version:
        description: 'App version to deploy (only for apply action)'
        required: false
        type: string

# OIDC permissions for keyless authentication
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  TF_WORKING_DIR: terraform/app
  LAMBDA_PACKAGE_PATH: output/package.zip

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">= 1.5"

      - name: Terraform fmt
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: format
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">= 1.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Backend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform plan
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_admin_username: ${{ secrets.ADMIN_USERNAME }}
          TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
          TF_VAR_project_bucket: ${{ secrets.AWS_PROJECT_S3_BUCKET }}
          TF_VAR_alert_email: ${{ vars.PERSONAL_EMAIL }}
          TF_VAR_lambda_package_path: ${{ env.LAMBDA_PACKAGE_PATH }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -no-color


  deploy:
    name: Terraform Apply/Destroy
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'workflow_dispatch' && (inputs.action == 'apply' || inputs.action == 'destroy')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">= 1.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Backend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download release artifacts
        if: inputs.action == 'apply'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading release artifacts..."
          gh release download --repo ${{ github.repository }} --pattern "*.zip" --dir output
          unzip -o output/*.zip -d output/
          cd output/release/backend-package && zip -r package.zip . && mv package.zip ../../package.zip

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform apply
        if: inputs.action == 'apply'
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_admin_username: ${{ secrets.ADMIN_USERNAME }}
          TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
          TF_VAR_project_bucket: ${{ secrets.AWS_PROJECT_S3_BUCKET }}
          TF_VAR_alert_email: ${{ vars.PERSONAL_EMAIL }}
          TF_VAR_lambda_package_path: ${{ github.workspace }}/${{ env.LAMBDA_PACKAGE_PATH }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve -no-color

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        env:
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          TF_VAR_admin_username: ${{ secrets.ADMIN_USERNAME }}
          TF_VAR_admin_password: ${{ secrets.ADMIN_PASSWORD }}
          TF_VAR_project_bucket: ${{ secrets.AWS_PROJECT_S3_BUCKET }}
          TF_VAR_alert_email: ${{ vars.PERSONAL_EMAIL }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -auto-approve -no-color

      - name: Sync frontend to S3 (after apply)
        if: inputs.action == 'apply'
        run: |
          echo "aws s3 sync ... (handled by Terraform/CloudFront)"