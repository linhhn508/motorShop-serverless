name: Release Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  BUCKET_NAME: my-frontend-bucket

jobs:
  check-versions:
    name: Check Version Changes
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.check.outputs.should-publish }}
      frontend-version: ${{ steps.frontend-version.outputs.version }}
      backend-version: ${{ steps.backend-version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read frontend version
        id: frontend-version
        working-directory: frontend
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid semver in package.json: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Frontend version: $VERSION"

      - name: Read backend version
        id: backend-version
        working-directory: backend
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid semver in pyproject.toml: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Backend version: $VERSION"

      - name: Check if versions changed from latest release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_VERSION: ${{ steps.frontend-version.outputs.version }}
          BACKEND_VERSION: ${{ steps.backend-version.outputs.version }}
        run: |
          # Check if the repo has any releases
          LATEST_VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)

          if [ -z "$LATEST_VERSION" ]; then
            echo "No previous release found — will publish"
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_VERSION_BODY=$(gh release view --repo "$GITHUB_REPOSITORY" --json body -q '.body' 2>/dev/null || true)

          if [ -z "$LATEST_VERSION_BODY" ]; then
            echo "Could not retrieve latest release body — failing the check"
            exit 1
          fi

          PREV_FE=$(echo "$LATEST_VERSION_BODY" | grep -oP 'Frontend: \K[^ |]+')
          PREV_BE=$(echo "$LATEST_VERSION_BODY" | grep -oP 'Backend: \K[^ |]+')

          echo "Previous: frontend=$PREV_FE backend=$PREV_BE"
          echo "Current:  frontend=$FRONTEND_VERSION backend=$BACKEND_VERSION"

          if [ "$PREV_FE" = "$FRONTEND_VERSION" ] && [ "$PREV_BE" = "$BACKEND_VERSION" ]; then
            echo "::warning::Both versions unchanged — skipping publish and release"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version change detected — will publish"
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: check-versions
    if: needs.check-versions.outputs.should-publish == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test:run
        working-directory: frontend

      - name: Build React app
        run: npm run build
        working-directory: frontend

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: check-versions
    if: needs.check-versions.outputs.should-publish == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: 3.12

      - name: Install python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Run ruff
        working-directory: backend
        run: uv run ruff check .

      - name: Run tests
        working-directory: backend
        run: uv run pytest tests/ -v

      - name: Build Lambda package
        working-directory: backend
        run: |
          uv export --no-dev -o requirements.txt
          pip install -r requirements.txt -t package/
          cp -r app/ package/
          rm -rf requirements.txt

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v6
        with:
          name: backend-package
          path: backend/package/
          retention-days: 1

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [check-versions, build-frontend, build-backend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Placeholder integration tests
        run: |
          echo "============================================"
          echo "  Integration tests placeholder"
          echo "  Frontend version: ${{ needs.check-versions.outputs.frontend-version }}"
          echo "  Backend version: ${{ needs.check-versions.outputs.backend-version }}"
          echo "  TODO: Add e2e/integration tests here"
          echo "============================================"

  publish:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    needs: [check-versions,integration-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # --- Frontend: Upload dist to S3 ---
      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Upload frontend to S3
        env:
          FRONTEND_VERSION: ${{ needs.check-versions.outputs.frontend-version }}
        run: |
          echo "Uploading frontend v$FRONTEND_VERSION to S3..."
          echo "aws s3 sync frontend-dist/ s3://\$BUCKET_NAME --delete"

      # --- Backend: Upload zip to Lambda function ---
      - name: Download backend build artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-package
          path: package.zip

      - name: Upload backend to Lambda
        env:
          BACKEND_VERSION: ${{ needs.check-versions.outputs.backend-version }}
        run: |
          echo "Uploading backend v$BACKEND_VERSION to Lambda..."
          echo "aws lambda update-function-code --function-name my-function --zip-file fileb64://package.zip"

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [publish, check-versions]
    permissions:
      contents: write
    steps:

      - name: Download frontend build artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: release/frontend-dist

      - name: Download backend build artifact
        uses: actions/download-artifact@v8
        with:
          name: backend-package
          path: release/backend-package

      - name: Generate release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_VERSION: ${{ needs.check-versions.outputs.frontend-version }}
          BACKEND_VERSION: ${{ needs.check-versions.outputs.backend-version }}
        run: |
          # Determine release tag (release-YYYY-MM-DD-N)
          DATE=$(date -u +%Y-%m-%d)
          COUNTER=1

          # Check existing tags for today
          EXISTING=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            | grep "release-${DATE}" | wc -l 2>/dev/null || echo "0")
          COUNTER=$((EXISTING + 1))

          RELEASE_TAG="release-${DATE}-${COUNTER}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Zip release folder
        run: |
          zip -r "$RELEASE_TAG.zip" release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRONTEND_VERSION: ${{ needs.check-versions.outputs.frontend-version }}
          BACKEND_VERSION: ${{ needs.check-versions.outputs.backend-version }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RELEASE_TAG.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes "Frontend: ${FRONTEND_VERSION} | Backend: ${BACKEND_VERSION} | Commit: ${GITHUB_SHA:0:7}"
