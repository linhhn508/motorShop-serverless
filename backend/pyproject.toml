[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Linh Ho Hoang", email = "linhhn508@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "a2wsgi>=1.10.10",
    "boto3>=1.43.72",
    "flask>=3.1.3",
    "mangum>=0.21.0",
    "pyjwt>=2.13.0",
]


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[dynamodb]>=5.0",
    "ruff>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "moto[dynamodb]>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false
